name: OTA Tracker

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: ota-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-ota:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.tracker.outputs.has_update }}
      build_id: ${{ steps.tracker.outputs.build_id }}
      release_type: ${{ steps.tracker.outputs.release_type }}
      target_version: ${{ steps.tracker.outputs.target_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        id: tracker
        run: python -m src.main

      - name: Commit state changes
        if: steps.tracker.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore(tracker): bump state to ${{ steps.tracker.outputs.target_version }} [${{ steps.tracker.outputs.build_id }}]"
          git push

  trigger-build:
    needs: check-ota
    if: needs.check-ota.outputs.has_update == 'true'
    uses: ./.github/workflows/build.yml
    with:
      devices: 'all'
      prerelease: false
