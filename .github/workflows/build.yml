name: Build and Release Pixel Props (BETA)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: '0 0 28 * *'
  workflow_dispatch:
    inputs:
      devices:
        description: 'Device codenames (space-separated, or "all")'
        required: true
        default: 'all'
      prerelease:
        description: 'Publish as Pre-Release (alpha tag)'
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      devices:
        description: 'Device codenames (space-separated, or "all")'
        required: false
        type: string
        default: 'all'
      prerelease:
        description: 'Publish as Pre-Release (alpha tag)'
        required: false
        type: boolean
        default: false
      source_ref:
        description: 'Branch, tag, or SHA of Build-Prop-BETA to check out'
        required: false
        type: string
        default: 'main'

jobs:
  # ------------------------------------------------------------------
  # PREPARE: Determine which devices to build based on input or default list
  # ------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set_devices.outputs.devices }}
      is_prerelease: ${{ steps.set_env.outputs.is_prerelease }}
    steps:
      - name: Determine environment
        id: set_env
        run: |
          PRERELEASE="${{ inputs.prerelease || github.event.inputs.prerelease }}"
          if [ "$PRERELEASE" = "true" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine device list
        id: set_devices
        run: |
          DEVICES="${{ inputs.devices || github.event.inputs.devices }}"
          if [ "$DEVICES" = "all" ] || [ -z "$DEVICES" ]; then
            JSON='["felix_beta17q2", "tangorpro_beta17q2", "shiba_beta17q2", "husky_beta17q2", "akita_beta17q2", "tokay_beta17q2", "caiman_beta17q2", "komodo_beta17q2", "comet_beta17q2", "tegu_beta17q2", "frankel_beta17q2", "blazer_beta17q2", "mustang_beta17q2", "rango_beta17q2", "stallion_beta17q2", "cubs_beta17q2", "grizzly_beta17q2", "kodiak_beta17q2", "yogi_beta17q2"]'
          else
            JSON=$(echo "$DEVICES" | tr ' ' '\n' | jq -R . | jq -s -c .)
          fi
          echo "devices=$JSON" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # BUILD: Download OTA, extract props, build module, and check for duplicates
  # ------------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.prepare.outputs.devices) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Elcapitanoe/Build-Prop-BETA
          ref: ${{ inputs.source_ref || 'main' }}
          submodules: recursive

      - name: Make scripts executable
        run: chmod +x *.sh module_files/*.sh 2>/dev/null || chmod +x *.sh

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full e2fsprogs erofs-utils lz4 cpio \
            dos2unix aria2 curl xxd python3 python3-pip jq

      - name: Install Python dependencies
        run: |
          pip3 install payload_dumper
          which payload_dumper || echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download OTA for ${{ matrix.device }}
        run: bash download_latest_ota_build.sh ${{ matrix.device }}

      - name: Extract and build
        run: bash extract_images.sh

      # Check if this module version was already released to avoid duplicates
      - name: Check for duplicates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          # The zip is created at repo root by build_module.sh, not in result/
          zip=$(find . -maxdepth 1 -name "*.zip" -type f -print -quit 2>/dev/null)
          if [ -z "$zip" ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          name=$(basename "$zip")
          echo "Built: $name"

          # Bypass duplicate checking for test alpha pre-releases
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Alpha pre-release mode: bypassing duplicate check for testing."
          else
            # Paginate through ALL releases to build a complete asset list
            EXISTING=$(mktemp)
            trap 'rm -f "$EXISTING"' EXIT

            page=1
            while :; do
              assets=$(gh api "repos/${{ github.repository }}/releases?per_page=100&page=${page}" \
                --jq '.[] | .assets[].name' 2>/dev/null)
              [ -z "$assets" ] && break
              printf '%s\n' "$assets" >> "$EXISTING"
              page=$((page + 1))
            done

            # Skip if this exact zip was already released
            if grep -qxF "$name" "$EXISTING" 2>/dev/null; then
              echo "SKIP (already released): $name"
              echo "has_new=false" >> "$GITHUB_OUTPUT"
              rm -f "$zip"
              exit 0
            fi
          fi

          # Extract metadata directly from the built module zip
          codename=$(echo "$name" | cut -d_ -f1 | tr '[:upper:]' '[:lower:]')
          desc=$(unzip -p "$zip" module.prop 2>/dev/null | grep -m1 '^description=' | cut -d= -f2- | tr -d '\r')
          device_name=$(unzip -p "$zip" system.prop 2>/dev/null | grep -m1 '^ro.product.model=' | cut -d= -f2- | tr -d '\r')
          build_desc=$(unzip -p "$zip" system.prop 2>/dev/null | grep -m1 '^ro.build.description=' | cut -d= -f2- | tr -d '\r')
          [ -z "$device_name" ] && device_name="${codename^}"

          zip_hash=$(sha256sum "$zip" | awk '{print $1}')

          mkdir -p upload
          mv "$zip" upload/

          # Save structured metadata for the release aggregation step
          jq -n \
            --arg codename "$codename" \
            --arg zip_name "$name" \
            --arg sha256 "$zip_hash" \
            --arg device_name "$device_name" \
            --arg description "$desc" \
            --arg build_desc "$build_desc" \
            '{codename: $codename, zip_name: $zip_name, sha256: $sha256, device_name: $device_name, description: $description, build_desc: $build_desc}' \
            > "upload/metadata-${codename}.json"

          # Mirror metadata by matrix device key for ordered lookup
          cp "upload/metadata-${codename}.json" "upload/metadata-${{ matrix.device }}.json" 2>/dev/null || true

          echo "has_new=true" >> "$GITHUB_OUTPUT"

      # Upload module + metadata artifact for the release job to collect
      - name: Upload artifact
        if: steps.check.outputs.has_new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: module-${{ matrix.device }}
          path: upload/*
          retention-days: 1

  # ------------------------------------------------------------------
  # RELEASE: Aggregate all built modules, create GitHub release, notify Telegram
  # ------------------------------------------------------------------
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: module-*
          merge-multiple: true
          path: new_modules/
        continue-on-error: true

      # Collect all modules, generate release notes, publish release, and notify
      - name: Aggregate and publish
        id: aggregate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          mkdir -p new_modules
          COUNT=$(ls new_modules/*.zip 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            TAG="alpha-$(date +%Y%m%d)"
            PRERELEASE_FLAG="--prerelease"
            TITLE_LABEL="Pixel Props (Alpha Pre-Release)"
          else
            TAG="beta-$(date +%Y%m%d)"
            PRERELEASE_FLAG=""
            TITLE_LABEL="Pixel Props (Beta)"
          fi

          REPO_URL="https://github.com/${{ github.repository }}"

          # Build per-device release notes in the order defined in prepare
          RELEASE_BODY="Automated build with $COUNT new module(s)."$'\n\n'
          while IFS= read -r device; do
            json="new_modules/metadata-${device}.json"
            [ -f "$json" ] || continue

            codename=$(jq -r '.codename' "$json")
            zip_name=$(jq -r '.zip_name' "$json")
            sha256=$(jq -r '.sha256' "$json")
            device_name=$(jq -r '.device_name' "$json")
            build_desc=$(jq -r '.build_desc // empty' "$json")

            RELEASE_BODY+="## ${device_name} (${codename^})"$'\n'
            RELEASE_BODY+="- File name: \`${zip_name}\`"$'\n'
            [ -n "$build_desc" ] && RELEASE_BODY+="- Build Description: \`${build_desc}\`"$'\n'
            RELEASE_BODY+="- File hash (SHA256): \`${sha256}\`"$'\n\n'
          done < <(echo '${{ needs.prepare.outputs.devices }}' | jq -r '.[]')

          printf '%s' "$RELEASE_BODY" > /tmp/release_notes.md

          # Build Telegram device list in the order defined in prepare
          DEVICE_LIST=""
          while IFS= read -r device; do
            json="new_modules/metadata-${device}.json"
            [ -f "$json" ] || continue
            zip_name=$(jq -r '.zip_name' "$json")
            device_name=$(jq -r '.device_name' "$json")
            download_url="${REPO_URL}/releases/download/${TAG}/${zip_name}"
            DEVICE_LIST+="- **${device_name}**: [${zip_name}](${download_url})"$'\n'
          done < <(echo '${{ needs.prepare.outputs.devices }}' | jq -r '.[]')

          # Create release if it doesn't exist, otherwise upload to existing
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" new_modules/*.zip --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              $PRERELEASE_FLAG \
              --notes-file /tmp/release_notes.md \
              new_modules/*.zip
          fi

          echo "has_new=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "title_label=$TITLE_LABEL" >> "$GITHUB_OUTPUT"
          {
            echo "devices<<EOF"
            printf '%s' "$DEVICE_LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Check Telegram credentials availability for safe step skipping
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "has_telegram=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_telegram=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update CHANGELOG.md
        if: steps.aggregate.outputs.has_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.aggregate.outputs.tag }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p target_repo
          cd target_repo
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin main --depth=1
          git checkout -b main origin/main
          cd ..

          python3 update_changelog.py

          cd target_repo
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "docs(changelog): update release history for ${TAG} [skip ci]"
            git push origin main
          fi

      - name: Notify Telegram
        if: steps.aggregate.outputs.has_new == 'true' && steps.aggregate.outputs.has_telegram == 'true'
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          disable_web_page_preview: true
          format: markdown
          message: |
            **${{ steps.aggregate.outputs.title_label }} — New OTA Available !**

            **Tag**: [${{ steps.aggregate.outputs.tag }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.aggregate.outputs.tag }})
            **Modules**: ${{ steps.aggregate.outputs.count }}

            **Devices**:
            ${{ steps.aggregate.outputs.devices }}
